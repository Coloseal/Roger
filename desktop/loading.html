<!doctype html>
<html><head><meta charset="utf-8"><title>Roger</title>
<style>
  html,body{margin:0;height:100%;background:#0a0e14;color:#e8eef6;font:15px system-ui,"Segoe UI",sans-serif}
  body{display:grid;place-items:center;text-align:center}
  h1{color:#ffb02e;letter-spacing:.12em;text-transform:uppercase;font-size:20px;margin:0 0 10px}
  p{color:#7f8f76;margin:4px 0}
  .bar{width:220px;height:4px;background:#1d251a;border-radius:2px;margin:18px auto;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#ffb02e;animation:m 1.2s ease-in-out infinite}
  @keyframes m{0%{margin-left:-40%}100%{margin-left:100%}}
</style></head>
<body><div>
  <h1>Roger</h1>
  <div class="bar"><i></i></div>
  <p id="msg">Connecting to the radio server…</p>
  <p>The first connection can take up to a minute while the server wakes up.</p>
</div></body></html>
